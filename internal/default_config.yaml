config:
  # List of additional directories to search for config and template files.
  additionalfiles: []
  configversion: "1.0.0"

# ---------------------------------------------------------------------------
# Vendor Sections
#
# This section defines vendors and the commands that this program will output.
# Users can create their own vendors here or in separate files referenced by
# `config.additionalfiles`.
#
# If the same vendor name is defined in multiple files, the LAST definition
# loaded will be used.
#
# ---------------------------------------------------------------------------
# Vendor structure (REQUIRED):
#
# <vendor_name>:
#   devicetype: <type>
#   commands:
#     - feature: <feature_name>
#       actions:
#         <action>: [ <command>, <command>, ... ]
#
# ---------------------------------------------------------------------------
# Vendor fields:
#
# vendor_name (REQUIRED)
#   - The name of the vendor (e.g. paloalto, cisco, juniper)
#   - Vendor order does NOT matter
#
# devicetype (REQUIRED)
#   Must be one of:
#     - firewall
#     - switch
#     - api
#     - dhcp
#
# commands (REQUIRED)
#   - An ORDERED list of command features
#   - Feature order is preserved exactly as written and determines the order
#     in which commands are output
#
# feature (REQUIRED)
#   - Logical grouping of commands (e.g. interface, vlan, dhcprelay)
#
# actions (REQUIRED)
#   - CRUD-style actions supported by this feature
#   - Only ONE action is selected per program run
#
# Allowed actions:
#     - create
#     - read
#     - update
#     - delete
#
# Each action must contain:
#   - A list of one or more command strings
#   - Lists must be used even if only one command is defined
#
# ---------------------------------------------------------------------------
# Command placeholders:
#
# Commands may contain placeholder keys that are replaced at runtime using
# user-provided input.
#
# Allowed placeholder keys:
#     - interface
#     - ipaddress
#     - vlanid
#     - vlanname
#     - zone
#     - cidr
#     - mask
#
# Placeholder format:
#     {{key}}
#
# Example:
#     set interface {{interface}} ip {{ipaddress}}
#
# ---------------------------------------------------------------------------
# Validation behavior:
#
# - Invalid CRUD action names are ignored with a warning
# - Invalid placeholder keys will cause configuration validation to FAIL
# - Features with no valid actions are ignored
#
# ---------------------------------------------------------------------------
# Example:
#
# paloalto:
#   devicetype: firewall
#   commands:
#     - feature: interface
#       actions:
#         create:
#           - set network interface aggregate-ethernet {{interface}} layer3 ip {{ipaddress}} vlan {{vlanid}}
#           - set network interface aggregate-ethernet {{interface}} description {{vlanname}}
#           - set zone {{zone}} network layer3 {{interface}}
#         update:
#           - set network interface aggregate-ethernet {{interface}} layer3 ip {{ipaddress}} vlan {{vlanid}}
#           - set network interface aggregate-ethernet {{interface}} description {{vlanname}}
#           - set zone {{zone}} network layer3 {{interface}}
#
#     - feature: dhcprelay
#       actions:
#         create: []
#
# ---------------------------------------------------------------------------



paloalto:
  devicetype: firewall
  commands:
    - feature: interface
      actions:
        create:
          - set network interface aggregate-ethernet {{interface}} layer3 ip {{ipaddress}} vlan {{vlanid}}
          - set network interface aggregate-ethernet {{interface}} description {{vlanname}}
          - set zone {{zone}} network layer3 {{interface}}
        update:
          - set network interface aggregate-ethernet {{interface}} layer3 ip {{ipaddress}} vlan {{vlanid}}
          - set network interface aggregate-ethernet {{interface}} description {{vlanname}}
          - set zone {{zone}} network layer3 {{interface}}
    - feature: dhcprelay
      actions: 
        create: []

cisco:
  devicetype: switch
  commands:
    - feature: vlan
      actions: 
        create:
          - vlan {{vlanid}}
          - name {{vlanname}}
        read:
          - show vlan id {{vlanid}}
        update:
          - vlan {{vlanid}}
          - name {{vlanname}}
        delete:
          - no vlan {{vlanid}}
